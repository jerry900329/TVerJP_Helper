plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tverjp'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.example.tverjp'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
